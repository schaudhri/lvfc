<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lahore Virgil Football Club</title>
    <meta
      name="description"
      content="Football for children aged 2 to 18 across four branches in Lahore. UEFA-aligned coaching, a clear player pathway, and our safeguarding policy published in full."
    />
    <meta name="theme-color" content="#540E17" />

    <!--
      Site-level share card. Per-route titles and descriptions are set at runtime
      (src/hooks/use-document-meta.ts), but crawlers for WhatsApp, Facebook and
      Instagram do not run JavaScript — they only ever see this file. Until the
      app is pre-rendered, every shared link previews with the card below no
      matter which page was shared.
      TODO: add og:image once real club photography exists (1200x630).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lahore Virgil Football Club" />
    <meta property="og:title" content="Lahore Virgil Football Club" />
    <meta
      property="og:description"
      content="Football for children aged 2 to 18 across four branches in Lahore. UEFA-aligned coaching, a clear player pathway, and our safeguarding policy published in full."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
